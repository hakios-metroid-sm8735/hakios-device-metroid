# devices/metroid/device.conf: what this device repository is (docs/porting/repositories.md has every word).

device metroid
	title       Nothing Phone (3)
	vendor      Nothing
	soc         sm8735
	defconfig   metroid_defconfig
	maintainer  hardik
	status      display     partial   ABL's splash framebuffer (0xFC800000, 1260x2800, 32-bit) through HakiOS U-Boot and the loader: Darwin 16.5's home screen seen on the panel (software drawing, cpu0 alone), 2026-11-13; no GPU; xl screenshot works (1260x2800 PNG)
	status      cpu         works     all 8 cores (cpus=8), the kernel started on cpu0: "8 processors running", each core finds its GIC redistributor 0x40000 apart; the system felt faster than on one core, 2026-11-13; no cpufreq yet (the cores run at what the firmware left); socinfo reads SoC 655 (SM8735) revision 1.1, board platform 11, from SMEM (socinfo=1, soc_smem from soc.args)
	status      usb         partial   the loader's fastboot (18d1:d00d, high speed) through U-Boot's DWC3, with the clocks, eUSB2 PHY and repeater as ABL left them (no SM8735 clock driver): xl state, xl run with the log fetched, xl reboot, 2026-11-13
	status      thermal     missing   four TSENS blocks (0x0c228000 to 0x0c22b000); hakios.thermal.c reads redwood's two, with a table for SC7280
	status      storage     partial   UFS through U-Boot, taken over as ABL left it (hakios,adopt-running-link: no reset, PHY or link startup; hibernate exit and START STOP UNIT active, because ABL leaves the link in hibernate and the device powered down): all 6 units read, every GPT crc right, the partitions listed (xnuloader oem ufssurvey), 2026-11-14; no logdump partition here, so the loader writes nothing; the kernel's reads (ufs=2) not yet tried
	status      touch       works     FocalTech 0x5672 on SPI (gpio16-19, by hand), touches accurate on the home screen and Settings opened from it, 2026-11-13 (CONFIG_HAKIOS_GOODIX, touchscreen=1 touch_board=metroid)
	status      buttons     works     power and volume down (PMK8550 PON), volume up (GPIO6 of the PMXR2230), read through the PMIC arbiter version 7; every press seen, 0 failed reads in 30006, 2026-11-13 (CONFIG_HAKIOS_BUTTONS, buttons_board=metroid)
