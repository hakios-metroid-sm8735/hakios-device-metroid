# devices/metroid/device.conf: what this device repository is (docs/porting/repositories.md has every word).

device metroid
	title       Nothing Phone (3)
	vendor      Nothing
	soc         sm8735
	defconfig   metroid_defconfig
	maintainer  hardik
	status      display     partial   ABL's splash framebuffer (0xFC800000, 1260x2800, 32-bit) through HakiOS U-Boot and the loader: Darwin 16.5's home screen seen on the panel (software drawing, cpu0 alone), 2026-11-13; no GPU; xl screenshot gets no screen geometry from the loader yet
	status      cpu         partial   the kernel booted and returned on cpu0 alone; other cores not tried (the GIC redistributor stride is unchecked)
	status      usb         partial   the loader's fastboot (18d1:d00d, high speed) through U-Boot's DWC3, with the clocks, eUSB2 PHY and repeater as ABL left them (no SM8735 clock driver): xl state, xl run with the log fetched, xl reboot, 2026-11-13
	status      storage     missing   no UFS in U-Boot yet: the loader's log is not written to logdump
	status      touch       works     FocalTech 0x5672 on SPI (gpio16-19, by hand), touches accurate on the home screen and Settings opened from it, 2026-11-13 (CONFIG_HAKIOS_GOODIX, touchscreen=1 touch_board=metroid)
	status      buttons     missing   PMK8550 PON (power, volume down) and a PMIC GPIO (volume up) not described to U-Boot yet
